<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorias — Ticket Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <a class="logo" href="dashboard.html">Ticket Management</a>
        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="tickets.html">Chamados</a></li>
            <li><a href="customers.html">Clientes</a></li>
            <li><a href="categories.html" class="active">Categorias</a></li>
            <li id="nav-users" style="display:none"><a href="users.html">Usuarios</a></li>
        </ul>
        <div class="user-info">
            <span id="user-name"></span>
            <button onclick="logout()">Sair</button>
        </div>
    </nav>

    <div class="container">
        <div class="toolbar">
            <h1>Categorias</h1>
            <button class="btn btn-primary" id="btn-novo" onclick="openModal()">Nova Categoria</button>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nome</th>
                        <th>Descricao</th>
                        <th>Criada em</th>
                        <th>Acoes</th>
                    </tr>
                </thead>
                <tbody id="categories-table">
                    <tr><td colspan="5" class="empty-state"><p>Carregando...</p></td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal" id="modal-category">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">x</button>
            <h3 id="modal-title">Nova Categoria</h3>
            <div id="modal-alert" class="alert alert-error" style="display:none"></div>
            <input type="hidden" id="category-id" />
            <div class="form-group">
                <label>Nome</label>
                <input type="text" id="category-name" placeholder="Nome da categoria" />
            </div>
            <div class="form-group">
                <label>Descricao</label>
                <textarea id="category-description" rows="3" placeholder="Descricao opcional..."></textarea>
            </div>
            <button class="btn btn-primary" onclick="saveCategory()">Salvar</button>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/categories.js"></script>
</body>
</html>
