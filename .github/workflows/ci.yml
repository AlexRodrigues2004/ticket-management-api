name: CI - Ticket Management API

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Rodar Testes
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:15-bullseye
        env:
          POSTGRES_DB: tickets_db_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: django-insecure-ci-test-key-123456
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: tickets_db_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar projeto Django
        run: python manage.py check

      - name: Rodar migrations
        run: python manage.py migrate

      - name: Rodar testes com cobertura
        run: pytest tests/ -v --cov=. --cov-report=term-missing --cov-report=xml

      - name: Exibir resumo de cobertura
        run: coverage report --fail-under=70

  lint:
    name: Verificar Qualidade do Código
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Rodar flake8
        run: |
          flake8 . --count --max-line-length=120 --exclude=venv,migrations,__pycache__ --statistics